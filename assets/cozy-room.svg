<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64" width="1000" height="320" shape-rendering="crispEdges">
  <title>Cozy pixel room — late night coding</title>
  <style>
    @keyframes twinkle { 0%,100% { opacity: 1 } 50% { opacity: .15 } }
    @keyframes rain { from { transform: translate(0,-34px) } to { transform: translate(-6px,34px) } }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes type { 0% { transform: scaleX(0) } 40%,85% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
    @keyframes steam { 0% { transform: translateY(0); opacity: 0 } 30% { opacity: .7 } 100% { transform: translateY(-9px); opacity: 0 } }
    @keyframes breathe { 0%,100% { transform: scaleY(1) } 50% { transform: scaleY(.85) } }
    @keyframes tail { 0%,70%,100% { transform: rotate(0) } 80% { transform: rotate(-25deg) } 90% { transform: rotate(10deg) } }
    @keyframes zzz { 0% { transform: translate(0,0); opacity: 0 } 20% { opacity: 1 } 100% { transform: translate(5px,-9px); opacity: 0 } }
    @keyframes glow { 0%,100% { opacity: .22 } 50% { opacity: .32 } }
    @keyframes bulb { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .tw { animation: twinkle 3s ease-in-out infinite }
    .drop { animation: rain 1.1s linear infinite }
    .line { transform-box: fill-box; transform-origin: left; animation: type 6s steps(12) infinite }
    .cursor { animation: blink 1s steps(1) infinite }
    .steam { animation: steam 2.6s ease-out infinite }
    .body { transform-box: fill-box; transform-origin: bottom; animation: breathe 3.2s ease-in-out infinite }
    .tail { transform-box: fill-box; transform-origin: right bottom; animation: tail 5s ease-in-out infinite }
    .z { animation: zzz 3.2s linear infinite }
    .glow { animation: glow 4s ease-in-out infinite }
    .bulb { animation: bulb 2s ease-in-out infinite }
  </style>
  <defs>
    <clipPath id="win"><rect x="16" y="10" width="36" height="26"/></clipPath>
    <radialGradient id="screenGlow"><stop offset="0" stop-color="#06B6D4"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
    <radialGradient id="lampGlow"><stop offset="0" stop-color="#fbbf24" stop-opacity=".45"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1030"/><stop offset="1" stop-color="#1e2a5a"/></linearGradient>
  </defs>

  <!-- wall & floor -->
  <rect width="200" height="64" fill="#151a2e"/>
  <rect y="0" width="200" height="2" fill="#11152a"/>
  <rect y="52" width="200" height="12" fill="#0e1122"/>
  <rect y="52" width="200" height="1" fill="#22284a"/>
  <rect x="30" y="56" width="140" height="6" fill="#2a1f3d"/>
  <rect x="32" y="57" width="136" height="1" fill="#3b2b55"/>
  <rect x="32" y="60" width="136" height="1" fill="#3b2b55"/>

  <!-- fairy lights -->
  <g>
    <rect x="60" y="4" width="84" height="1" fill="#2e3555"/>
    <rect class="bulb" x="64" y="5" width="2" height="2" fill="#f472b6"/>
    <rect class="bulb" x="74" y="5" width="2" height="2" fill="#fbbf24" style="animation-delay:.4s"/>
    <rect class="bulb" x="84" y="5" width="2" height="2" fill="#06B6D4" style="animation-delay:.8s"/>
    <rect class="bulb" x="94" y="5" width="2" height="2" fill="#a78bfa" style="animation-delay:1.2s"/>
    <rect class="bulb" x="104" y="5" width="2" height="2" fill="#34d399" style="animation-delay:1.6s"/>
    <rect class="bulb" x="114" y="5" width="2" height="2" fill="#f472b6" style="animation-delay:.2s"/>
    <rect class="bulb" x="124" y="5" width="2" height="2" fill="#fbbf24" style="animation-delay:.6s"/>
    <rect class="bulb" x="134" y="5" width="2" height="2" fill="#06B6D4" style="animation-delay:1s"/>
  </g>

  <!-- window -->
  <rect x="14" y="8" width="40" height="30" fill="#2a3150"/>
  <rect x="16" y="10" width="36" height="26" fill="url(#sky)"/>
  <g clip-path="url(#win)">
    <rect x="44" y="12" width="5" height="5" fill="#f5e6b8"/>
    <rect x="43" y="13" width="1" height="3" fill="#f5e6b8"/>
    <rect x="46" y="12" width="3" height="2" fill="#1a2350"/>
    <rect class="tw" x="20" y="13" width="1" height="1" fill="#fff"/>
    <rect class="tw" x="27" y="17" width="1" height="1" fill="#fff" style="animation-delay:1s"/>
    <rect class="tw" x="38" y="12" width="1" height="1" fill="#fff" style="animation-delay:2s"/>
    <rect class="tw" x="24" y="27" width="1" height="1" fill="#fff" style="animation-delay:.5s"/>
    <rect class="tw" x="47" y="26" width="1" height="1" fill="#fff" style="animation-delay:1.5s"/>
    <!-- distant city -->
    <rect x="16" y="30" width="6" height="6" fill="#0a0f24"/>
    <rect x="22" y="27" width="5" height="9" fill="#0d132c"/>
    <rect x="27" y="31" width="7" height="5" fill="#0a0f24"/>
    <rect x="35" y="25" width="5" height="11" fill="#0d132c"/>
    <rect x="40" y="29" width="6" height="7" fill="#0a0f24"/>
    <rect x="46" y="32" width="6" height="4" fill="#0d132c"/>
    <rect x="23" y="29" width="1" height="1" fill="#fbbf24"/>
    <rect x="37" y="27" width="1" height="1" fill="#06B6D4"/>
    <rect x="37" y="31" width="1" height="1" fill="#fbbf24"/>
    <rect x="42" y="31" width="1" height="1" fill="#fbbf24"/>
    <!-- rain -->
    <g fill="#7aa2f7" opacity=".55">
      <rect class="drop" x="19" y="10" width="1" height="3"/>
      <rect class="drop" x="25" y="16" width="1" height="3" style="animation-delay:.3s"/>
      <rect class="drop" x="31" y="8" width="1" height="3" style="animation-delay:.7s"/>
      <rect class="drop" x="37" y="18" width="1" height="3" style="animation-delay:.15s"/>
      <rect class="drop" x="43" y="12" width="1" height="3" style="animation-delay:.5s"/>
      <rect class="drop" x="49" y="20" width="1" height="3" style="animation-delay:.9s"/>
      <rect class="drop" x="53" y="9" width="1" height="3" style="animation-delay:.4s"/>
      <rect class="drop" x="28" y="24" width="1" height="3" style="animation-delay:.8s"/>
      <rect class="drop" x="46" y="4" width="1" height="3" style="animation-delay:.2s"/>
    </g>
  </g>
  <rect x="33" y="10" width="2" height="26" fill="#2a3150"/>
  <rect x="16" y="22" width="36" height="2" fill="#2a3150"/>
  <rect x="12" y="38" width="44" height="2" fill="#3a4266"/>
  <!-- curtains -->
  <rect x="10" y="7" width="4" height="30" fill="#6d28d9"/>
  <rect x="11" y="7" width="1" height="30" fill="#7c3aed"/>
  <rect x="54" y="7" width="4" height="30" fill="#6d28d9"/>
  <rect x="56" y="7" width="1" height="30" fill="#7c3aed"/>
  <rect x="9" y="6" width="50" height="1" fill="#4b5280"/>

  <!-- plant on sill -->
  <rect x="18" y="34" width="6" height="4" fill="#b45309"/>
  <rect x="18" y="34" width="6" height="1" fill="#d97706"/>
  <rect x="20" y="30" width="2" height="4" fill="#15803d"/>
  <rect x="17" y="29" width="3" height="2" fill="#22c55e"/>
  <rect x="22" y="28" width="3" height="2" fill="#22c55e"/>
  <rect x="20" y="27" width="2" height="2" fill="#4ade80"/>

  <!-- shelf with books -->
  <rect x="150" y="18" width="40" height="2" fill="#5a3e2b"/>
  <rect x="152" y="10" width="3" height="8" fill="#06B6D4"/>
  <rect x="155" y="11" width="3" height="7" fill="#a78bfa"/>
  <rect x="158" y="9" width="2" height="9" fill="#f472b6"/>
  <rect x="160" y="12" width="3" height="6" fill="#fbbf24"/>
  <rect x="164" y="13" width="6" height="2" fill="#34d399"/>
  <rect x="164" y="15" width="6" height="3" fill="#60a5fa"/>
  <rect x="174" y="13" width="5" height="5" fill="#b45309"/>
  <rect x="175" y="10" width="3" height="3" fill="#22c55e"/>
  <rect x="182" y="12" width="6" height="6" fill="#1f2937"/>
  <rect x="183" y="13" width="4" height="4" fill="#06B6D4" opacity=".6"/>
  <!-- poster -->
  <rect x="160" y="24" width="20" height="14" fill="#1f2433"/>
  <rect x="161" y="25" width="18" height="12" fill="#0f172a"/>
  <rect x="163" y="28" width="2" height="2" fill="#06B6D4"/>
  <rect x="165" y="30" width="2" height="2" fill="#06B6D4"/>
  <rect x="163" y="32" width="2" height="2" fill="#06B6D4"/>
  <rect x="168" y="33" width="6" height="1" fill="#06B6D4"/>

  <!-- glows -->
  <ellipse class="glow" cx="101" cy="30" rx="34" ry="22" fill="url(#screenGlow)"/>
  <ellipse cx="146" cy="42" rx="16" ry="10" fill="url(#lampGlow)"/>

  <!-- desk -->
  <rect x="40" y="44" width="140" height="2" fill="#7c5a3f"/>
  <rect x="40" y="46" width="140" height="2" fill="#5a3e2b"/>
  <rect x="44" y="48" width="3" height="8" fill="#4a3222"/>
  <rect x="173" y="48" width="3" height="8" fill="#4a3222"/>

  <!-- monitor -->
  <rect x="80" y="18" width="42" height="23" fill="#1f2433"/>
  <rect x="82" y="20" width="38" height="18" fill="#05111a"/>
  <rect x="99" y="41" width="4" height="2" fill="#2b3145"/>
  <rect x="95" y="43" width="12" height="1" fill="#2b3145"/>
  <g>
    <rect class="line" x="84" y="22" width="10" height="1" fill="#a78bfa"/>
    <rect class="line" x="86" y="24" width="18" height="1" fill="#06B6D4" style="animation-delay:.3s"/>
    <rect class="line" x="88" y="26" width="14" height="1" fill="#34d399" style="animation-delay:.6s"/>
    <rect class="line" x="88" y="28" width="22" height="1" fill="#06B6D4" style="animation-delay:.9s"/>
    <rect class="line" x="86" y="30" width="8" height="1" fill="#f472b6" style="animation-delay:1.2s"/>
    <rect class="line" x="84" y="32" width="16" height="1" fill="#a78bfa" style="animation-delay:1.5s"/>
    <rect class="cursor" x="84" y="34" width="2" height="2" fill="#06B6D4"/>
  </g>
  <!-- keyboard -->
  <rect x="84" y="42" width="10" height="2" fill="#2b3145"/>
  <rect x="108" y="42" width="10" height="2" fill="#2b3145"/>
  <rect x="85" y="42" width="8" height="1" fill="#3b4260"/>
  <rect x="109" y="42" width="8" height="1" fill="#3b4260"/>

  <!-- mug + steam -->
  <rect x="127" y="39" width="6" height="5" fill="#e2e8f0"/>
  <rect x="127" y="39" width="6" height="1" fill="#7c4a2b"/>
  <rect x="133" y="40" width="2" height="1" fill="#e2e8f0"/>
  <rect x="134" y="40" width="1" height="3" fill="#e2e8f0"/>
  <rect x="133" y="42" width="2" height="1" fill="#e2e8f0"/>
  <rect x="128" y="41" width="2" height="2" fill="#06B6D4"/>
  <g fill="#cbd5e1">
    <rect class="steam" x="129" y="35" width="1" height="2"/>
    <rect class="steam" x="131" y="34" width="1" height="2" style="animation-delay:.9s"/>
    <rect class="steam" x="130" y="36" width="1" height="2" style="animation-delay:1.7s"/>
  </g>

  <!-- lamp -->
  <rect x="140" y="42" width="8" height="2" fill="#374151"/>
  <rect x="143" y="32" width="1" height="10" fill="#4b5563"/>
  <rect x="144" y="30" width="4" height="1" fill="#4b5563"/>
  <rect x="146" y="28" width="7" height="3" fill="#f59e0b"/>
  <rect x="147" y="31" width="5" height="1" fill="#fde68a"/>

  <!-- sleeping cat -->
  <g>
    <rect class="tail" x="47" y="42" width="7" height="2" fill="#f4a261"/>
    <g class="body">
      <rect x="53" y="39" width="13" height="5" fill="#f4a261"/>
      <rect x="54" y="38" width="10" height="1" fill="#f4a261"/>
      <rect x="56" y="39" width="2" height="1" fill="#e76f51"/>
      <rect x="60" y="39" width="2" height="1" fill="#e76f51"/>
    </g>
    <rect x="64" y="38" width="6" height="6" fill="#f4a261"/>
    <rect x="64" y="36" width="2" height="2" fill="#f4a261"/>
    <rect x="68" y="36" width="2" height="2" fill="#f4a261"/>
    <rect x="65" y="37" width="1" height="1" fill="#f9c6b0"/>
    <rect x="68" y="37" width="1" height="1" fill="#f9c6b0"/>
    <rect x="65" y="40" width="2" height="1" fill="#3b2a20"/>
    <rect x="68" y="40" width="1" height="1" fill="#3b2a20"/>
    <rect x="67" y="42" width="1" height="1" fill="#e76f51"/>
    <rect x="62" y="43" width="3" height="1" fill="#fde2d0"/>
  </g>
  <g fill="#a5b4fc" font-family="monospace" font-weight="bold">
    <text class="z" x="70" y="35" font-size="4">z</text>
    <text class="z" x="70" y="35" font-size="3" style="animation-delay:1.6s">z</text>
  </g>
</svg>
